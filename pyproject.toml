[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chaoscode-cli"
version = "0.1.0"
description = "A terminal and desktop coding agent powered by DeepSeek's free web interface"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ChaosCode contributors" }]
keywords = ["cli", "coding-agent", "deepseek", "developer-tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
]
dependencies = [
  "curl-cffi>=0.8.1,<1.0",
  "wasmtime>=20,<51",
  "prompt-toolkit>=3.0.43,<4",
]

[project.optional-dependencies]
desktop = ["PySide6-Essentials>=6.7,<7"]

[project.scripts]
chaoscode = "chaoscode.cli:main"

[project.gui-scripts]
chaoscode-desktop = "chaoscode.desktop_entry:main"

[tool.setuptools.packages.find]
include = ["chaoscode*"]

[tool.setuptools.package-data]
chaoscode = ["_vendor/deepseek4free/*.wasm", "_vendor/deepseek4free/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
